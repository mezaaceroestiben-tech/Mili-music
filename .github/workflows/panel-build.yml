name: Panel Build - Android Gradle
on:
  workflow_dispatch:
jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      EMM_FIRMA: ${{ secrets.EMM_FIRMA }}
    steps:
      - uses: actions/checkout@v4
      - name: Extraer código fuente (ZIP)
        shell: bash
        run: |
          if [ -f .emm/fuente_dir.txt ]; then
            D=$(tr -d '\r\n' < .emm/fuente_dir.txt)
            cat "$D"/p* > fuente.zip
            rm -rf "$D" .emm/fuente_dir.txt
          fi
          rm -rf _src && mkdir _src
          if command -v unzip >/dev/null 2>&1; then unzip -q -o fuente.zip -d _src; else 7z x -y -o_src fuente.zip >/dev/null; fi
          rm -rf _src/__MACOSX
          if [ "$(ls -A _src | wc -l)" = "1" ] && [ -d "_src/$(ls -A _src)" ]; then
            cp -a "_src/$(ls -A _src)/." .
          else
            cp -a _src/. .
          fi
          rm -rf _src fuente.zip
      - name: Aplicar personalizacion (nombre, paquete, version, icono)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, re, glob, os, subprocess, sys
          CFG = ".emm/personalizacion.json"
          ICONO = ".emm/icono.png"
          if not os.path.exists(CFG):
              print("Sin config de personalizacion, se omite.")
              sys.exit(0)
          cfg = json.load(open(CFG, encoding="utf-8"))
          nombre = (cfg.get("app_name") or "").strip()
          pkg = (cfg.get("package_id") or "").strip()
          vname = (cfg.get("version_name") or "").strip()
          vcode = str(cfg.get("version_code") or "").strip()
          novedades = (cfg.get("novedades") or "").strip()
          repo_act = (cfg.get("repo_actualizaciones") or "").strip()
          if repo_act and os.environ.get("GITHUB_ENV"):
              with open(os.environ["GITHUB_ENV"], "a") as e:
                  e.write("UPDATE_REPO=" + repo_act + "\n")
          if novedades:
              def esc(t):
                  t = t.replace("\\", "\\\\").replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                  t = t.replace("'", "\\'").replace('"', '\\"').replace("%", "\uff05")
                  t = t.replace("@", "\\@").replace("?", "\\?")
                  return "\\n".join(l.strip() for l in t.splitlines())
              cuerpo = esc(novedades)
              n_nov = 0
              for f in glob.glob("**/res/values/*.xml", recursive=True):
                  s = open(f, encoding="utf-8").read()
                  s2, n = re.subn(r'(<string name="welcome_last_update_body">)[\s\S]*?(</string>)', lambda m: m.group(1) + cuerpo + m.group(2), s)
                  if n:
                      open(f, "w", encoding="utf-8").write(s2)
                      n_nov += n
              print("Novedades aplicadas en " + str(n_nov) + " archivo(s).")
          def reemplazar(patron, repl, texto, flags=0, count=0):
              return re.subn(patron, repl, texto, count=count, flags=flags)
          if os.path.exists("buildozer.spec"):
              txt = open("buildozer.spec", encoding="utf-8").read()
              def set_ini(txt, clave, valor):
                  if not valor:
                      return txt
                  patron = re.compile(r"^" + re.escape(clave) + r"\s*=.*$", re.M)
                  linea = clave + " = " + valor
                  nuevo, n = patron.subn(lambda m: linea, txt)
                  return nuevo if n else (txt.rstrip("\n") + "\n" + linea + "\n")
              txt = set_ini(txt, "title", nombre)
              if pkg and "." in pkg:
                  dominio, nombrepkg = pkg.rsplit(".", 1)
                  txt = set_ini(txt, "package.domain", dominio)
                  txt = set_ini(txt, "package.name", nombrepkg)
              txt = set_ini(txt, "version", vname)
              if os.path.exists(ICONO):
                  os.makedirs("data", exist_ok=True)
                  subprocess.run(["cp", ICONO, "data/icon.png"], check=False)
                  txt = set_ini(txt, "icon.filename", "%(source.dir)s/data/icon.png")
              open("buildozer.spec", "w", encoding="utf-8").write(txt)
              print("Personalizacion aplicada (Kivy/buildozer).")
              sys.exit(0)
          cambios = 0
          cambios_nombre = 0
          if nombre:
              xml_nombre = nombre.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\\", "\\\\").replace("'", "\\'").replace('"', '\\"')
              if xml_nombre[:1] in ("@", "?"):
                  xml_nombre = "\\" + xml_nombre
              g_nombre = nombre.replace("\\", "\\\\").replace('"', '\\"').replace("$", "\\$")
              patron_xml = re.compile(r'(<string\b[^>]*\bname="app_name"[^>]*>)[^<]*(</string>)')
              for f in glob.glob("**/res/values*/*.xml", recursive=True):
                  if "/build/" in f.replace("\\", "/") or f.startswith("build/"):
                      continue
                  s = open(f, encoding="utf-8").read()
                  if 'name="app_name"' not in s:
                      continue
                  s2, n = patron_xml.subn(lambda m: m.group(1) + xml_nombre + m.group(2), s)
                  if n:
                      open(f, "w", encoding="utf-8").write(s2); cambios += n; cambios_nombre += n
              def poner_nombre_gradle(m):
                  sufijo = " Debug" if "Debug" in m.group(2) else ""
                  return m.group(1) + '"' + g_nombre + sufijo + '"' + m.group(3)
              patron_g = re.compile(r'(resValue\(\s*"string"\s*,\s*"app_name"\s*,\s*)(.*?)(\)[ \t]*$)', re.M)
              patron_g2 = re.compile(r'''(resValue\s+["']string["']\s*,\s*["']app_name["']\s*,\s*)(["'][^"'\n]*["'])()''')
              for f in glob.glob("**/build.gradle*", recursive=True):
                  if "/build/" in f.replace("\\", "/") or f.startswith("build/"):
                      continue
                  s = open(f, encoding="utf-8").read()
                  if "app_name" not in s:
                      continue
                  s2, n1 = patron_g.subn(poner_nombre_gradle, s)
                  s2, n2 = patron_g2.subn(poner_nombre_gradle, s2)
                  if n1 + n2:
                      open(f, "w", encoding="utf-8").write(s2); cambios += n1 + n2; cambios_nombre += n1 + n2
              def etiqueta_app(m):
                  return re.sub(r'android:label="(?!@)[^"]*"', lambda k: 'android:label="' + xml_nombre + '"', m.group(0), count=1)
              for f in glob.glob("**/AndroidManifest.xml", recursive=True):
                  if "/build/" in f.replace("\\", "/") or f.startswith("build/"):
                      continue
                  s = open(f, encoding="utf-8").read()
                  s2 = re.sub(r'<application\b[^>]*>', etiqueta_app, s, count=1)
                  if s2 != s:
                      open(f, "w", encoding="utf-8").write(s2); cambios += 1; cambios_nombre += 1
              print("Nombre de la app: " + nombre + " (" + str(cambios_nombre) + " sitio(s) cambiados).")
              if cambios_nombre == 0:
                  print("::warning::No encontre donde poner el nombre de la app; se queda el original.")
              if os.path.exists("android") and os.path.exists("pubspec.yaml"):
                  for f in glob.glob("android/**/AndroidManifest.xml", recursive=True):
                      s = open(f, encoding="utf-8").read()
                      s2, n = reemplazar(r'android:label="[^"]*"', 'android:label="' + nombre + '"', s)
                      if n:
                          open(f, "w", encoding="utf-8").write(s2); cambios += n
          if pkg:
              for f in glob.glob("**/build.gradle*", recursive=True):
                  s = open(f, encoding="utf-8").read()
                  s2, n = reemplazar(r'(\b(?:base)?[aA]pplicationId\s*=?\s*["\'])[^"\']*(["\'])', lambda m: m.group(1) + pkg + m.group(2), s, count=1)
                  if n:
                      open(f, "w", encoding="utf-8").write(s2); cambios += n
          if vname:
              for f in glob.glob("**/build.gradle*", recursive=True):
                  s = open(f, encoding="utf-8").read()
                  s2, n = reemplazar(r'(\bversionName\s*=?\s*["\'])[^"\']*(["\'])', lambda m: m.group(1) + vname + m.group(2), s, count=1)
                  if n:
                      open(f, "w", encoding="utf-8").write(s2); cambios += n
              if os.path.exists("pubspec.yaml"):
                  s = open("pubspec.yaml", encoding="utf-8").read()
                  codigo = vcode or "1"
                  s2, n = reemplazar(r'^version:\s*.*$', lambda m: "version: " + vname + "+" + codigo, s, flags=re.M)
                  if n:
                      open("pubspec.yaml", "w", encoding="utf-8").write(s2); cambios += n
          if vcode:
              for f in glob.glob("**/build.gradle*", recursive=True):
                  s = open(f, encoding="utf-8").read()
                  s2, n = reemplazar(r'(\bversionCode\s*=?\s*)\d+', lambda m: m.group(1) + vcode, s, count=1)
                  if n:
                      open(f, "w", encoding="utf-8").write(s2); cambios += n
          if os.path.exists(ICONO):
              tamanos = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
              for carpeta, px in tamanos.items():
                  for d in glob.glob("**/" + carpeta, recursive=True):
                      for nombre_ic in ("ic_launcher.png", "ic_launcher_round.png"):
                          subprocess.run(["convert", ICONO, "-resize", str(px) + "x" + str(px) + "!", os.path.join(d, nombre_ic)], check=False)
                          cambios += 1
          print("Personalizacion aplicada: " + str(cambios) + " cambio(s).")
          PYEOF
      - name: Detectar versión de Java y variante
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import re, glob, os
          def ver(a, b):
              return int(b) if (a == "1" and b) else int(a)
          v = 0
          archivos = glob.glob("**/*.gradle", recursive=True) + glob.glob("**/*.gradle.kts", recursive=True)
          for f in archivos:
              try:
                  t = open(f, encoding="utf-8", errors="ignore").read()
              except Exception:
                  continue
              for a, b in re.findall(r"(?:VERSION|JVM)_(\d+)(?:_(\d+))?", t):
                  v = max(v, ver(a, b))
              for a in re.findall(r"jvmToolchain\(\s*(\d+)\s*\)", t):
                  v = max(v, int(a))
          jv = max(17, v)
          flavor = ""
          if os.path.exists(".emm/variante.txt"):
              flavor = open(".emm/variante.txt", encoding="utf-8").read().strip()
          else:
              app = None
              for c in ["app/build.gradle.kts", "app/build.gradle"] + archivos:
                  if os.path.exists(c) and "com.android.application" in open(c, encoding="utf-8", errors="ignore").read():
                      app = c
                      break
              if app:
                  t = open(app, encoding="utf-8", errors="ignore").read()
                  dim = re.search(r"flavorDimensions[^\n]*", t)
                  i = t.find("productFlavors")
                  if dim and i >= 0 and len(re.findall(r"[\"'](\w+)[\"']", dim.group(0))) == 1:
                      j = t.find("{", i)
                      nivel = 0
                      k = j
                      nombres = []
                      while k < len(t):
                          c = t[k]
                          if c == "{":
                              nivel += 1
                          elif c == "}":
                              nivel -= 1
                              if nivel == 0:
                                  break
                          k += 1
                      bloque = t[j:k]
                      nivel = 0
                      for linea in bloque.split("\n"):
                          if nivel == 1:
                              m = re.search(r"(?:create|register)\(\s*[\"'](\w+)[\"']\s*\)", linea) or re.match(r"\s*(\w+)\s*\{", linea)
                              if m:
                                  nombres.append(m.group(1))
                          nivel += linea.count("{") - linea.count("}")
                      for pref in ["izzy", "foss", "gms"]:
                          if pref in nombres:
                              flavor = pref
                              break
                      else:
                          flavor = nombres[0] if nombres else ""
          flavor = flavor[:1].upper() + flavor[1:]
          print("Java:", jv, "| variante:", flavor or "(ninguna)")
          with open(os.environ["GITHUB_ENV"], "a") as e:
              e.write("JV=" + str(jv) + "\n")
              e.write("EMM_FLAVOR=" + flavor + "\n")
          PYEOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JV }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar compilación universal (32 y 64 bits)
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/emm-universal.gradle <<'GRADLEEOF'
          allprojects { p ->
            p.afterEvaluate {
              def android = p.extensions.findByName('android')
              if (android != null && p.plugins.hasPlugin('com.android.application')) {
                try { android.defaultConfig.ndk.abiFilters.clear() } catch (Throwable e) { println "EMM: sin filtros ABI en defaultConfig: " + e }
                try { android.productFlavors.each { it.ndk.abiFilters.clear() } } catch (Throwable e) { }
                try { android.buildTypes.each { it.ndk.abiFilters.clear() } } catch (Throwable e) { }
                try { android.defaultConfig.externalNativeBuild.cmake.abiFilters.clear() } catch (Throwable e) { }
                try { android.defaultConfig.externalNativeBuild.ndkBuild.abiFilters.clear() } catch (Throwable e) { }
                try { android.splits.abi.enable = false } catch (Throwable e) { }
                println "EMM: APK universal (todas las arquitecturas) en " + p.path
              }
            }
          }
          GRADLEEOF
      - name: Activar ofuscación y reducción de código (R8/ProGuard)
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/emm-minify.gradle <<'GRADLEEOF'
          allprojects { p ->
            p.afterEvaluate {
              def android = p.extensions.findByName('android')
              if (android != null && p.plugins.hasPlugin('com.android.application')) {
                try {
                  android.buildTypes.release.minifyEnabled true
                  android.buildTypes.release.shrinkResources true
                  if (!android.buildTypes.release.proguardFiles || android.buildTypes.release.proguardFiles.isEmpty()) {
                    android.buildTypes.release.proguardFiles(android.getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
                  }
                  println "EMM: ofuscación (R8) activada en " + p.path
                } catch (Throwable e) { println "EMM: no se pudo activar ofuscación en " + p.path + ": " + e }
              }
            }
          }
          GRADLEEOF
      - name: Compilar APK
        run: |
          G=gradle
          if [ -f gradlew ]; then chmod +x gradlew; G=./gradlew; fi
          F="${EMM_FLAVOR:-}"
          if [ -n "${EMM_FIRMA:-}" ]; then
            echo "Compilando assemble${F}Release"
            $G "assemble${F}Release" --no-daemon --console=plain || { echo "::warning::Falló la compilación Release; se compila Debug"; $G "assemble${F}Debug" --no-daemon --console=plain; }
          else
            echo "Compilando assemble${F}Debug"
            $G "assemble${F}Debug" --no-daemon --console=plain
          fi
      - name: Firmar APK con la firma propia
        if: env.EMM_FIRMA != ''
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          KS="$RUNNER_TEMP/firma.jks"
          printf '%s\n' "$EMM_FIRMA" | sed -n 1p | base64 -d > "$KS"
          export KSPASS=$(printf '%s\n' "$EMM_FIRMA" | sed -n 2p)
          ALIAS=$(printf '%s\n' "$EMM_FIRMA" | sed -n 3p)
          export KEYPASS=$(printf '%s\n' "$EMM_FIRMA" | sed -n 4p)
          find . -type f -name '*.apk' -not -path './.git/*' -print0 | while IFS= read -r -d '' APK; do
            "$BT/zipalign" -f -p 4 "$APK" "$APK.tmp" && mv "$APK.tmp" "$APK"
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass env:KSPASS --key-pass env:KEYPASS "$APK"
            "$BT/apksigner" verify --print-certs "$APK" | head -n 3
            NUEVO="${APK/-unsigned/-firmado}"
            if [ "$NUEVO" != "$APK" ]; then mv "$APK" "$NUEVO"; fi
          done
          rm -f "$KS"
      - name: Nombrar el APK (nombre, versión, arquitectura según tu elección)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os, re, glob, zipfile, unicodedata
          
          CFG = {}
          try:
            CFG = json.load(open(".emm/personalizacion.json", encoding="utf-8"))
          except Exception:
            pass
          
          def limpiar(t):
            t = re.sub(r"\.[aA][pP][kK]\s*$", "", (t or "").strip())
            t = unicodedata.normalize("NFKD", t).encode("ascii", "ignore").decode()
            t = re.sub(r"\s+", "-", t)
            t = re.sub(r"[^A-Za-z0-9._-]+", "_", t)
            return t.strip("_.-")
          
          base = limpiar(CFG.get("apk_nombre")) or limpiar(CFG.get("app_name")) or limpiar(os.environ.get("GITHUB_REPOSITORY", "app").split("/")[-1]) or "app"
          ver = limpiar(CFG.get("version_name"))
          partes = CFG.get("apk_partes")
          if not isinstance(partes, list):
            partes = ["version"]
          usar_ver = "version" in partes and ver != ""
          usar_arq = "arq" in partes
          usar_disp = "dispositivo" in partes
          
          RUIDO = {"release", "unsigned", "firmado", "signed", "aligned", "debug", "app"}
          
          def arquitectura(ruta):
            try:
              abis = set()
              for n in zipfile.ZipFile(ruta).namelist():
                m = re.match(r"lib/([^/]+)/", n)
                if m:
                  abis.add(m.group(1))
              if not abis or len(abis) > 1:
                return "universal"
              return abis.pop()
            except Exception:
              return "universal"
          
          apks = [p for p in glob.glob("**/*.apk", recursive=True) if not p.startswith(".git/")]
          info = []
          for p in apks:
            b = os.path.basename(p)[:-4]
            toks = [t for t in re.split(r"-", b) if t and t.lower() not in RUIDO]
            disp = ""
            if "telefono-y-tv" in b:
              disp = "telefono-y-tv"
            elif re.search(r"(^|-)tv(-|$)", b):
              disp = "tv"
            elif "telefono" in b:
              disp = "telefono"
            info.append((p, disp, arquitectura(p)))
          
          varios = len(info) > 1
          usados = set()
          for p, disp, arq in info:
            d = os.path.dirname(p)
            partes_n = [base]
            if usar_ver:
              partes_n.append(ver)
            if usar_arq:
              partes_n.append(arq)
            if usar_disp or (varios and disp):
              partes_n.append(disp) if disp else None
            dest = os.path.join(d, "-".join(partes_n) + ".apk")
            if dest in usados or (os.path.exists(dest) and dest != p):
              extra = [t for t in (disp, arq) if t and t not in partes_n]
              dest = os.path.join(d, "-".join(partes_n + extra) + ".apk")
            n = 2
            while dest in usados or (os.path.exists(dest) and dest != p):
              dest = os.path.join(d, "-".join(partes_n + [str(n)]) + ".apk")
              n += 1
            usados.add(dest)
            if dest != p:
              os.rename(p, dest)
            print("APK: " + os.path.basename(dest))
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
  publicar_actualizacion:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .emm
      - name: Leer los datos de la versión
        id: info
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os
          cfg = {}
          try:
              cfg = json.load(open(".emm/personalizacion.json", encoding="utf-8"))
          except Exception:
              pass
          app = (cfg.get("app_name") or os.environ["GITHUB_REPOSITORY"].split("/")[1]).strip()
          ver = (cfg.get("version_name") or "").strip()
          tag = ("v" + ver) if ver else ("build-" + os.environ["GITHUB_RUN_NUMBER"])
          titulo = (app + " " + ver) if ver else (app + " " + tag)
          notas = (cfg.get("novedades") or "").strip() or ("Versión " + tag)
          pub = (cfg.get("publicador") or "").strip()
          if pub:
            notas = notas + "\n\n— Publicado por " + pub
          open("notas.md", "w", encoding="utf-8").write(notas + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write("tag=" + tag + "\n")
              o.write("titulo=" + titulo + "\n")
          PYEOF
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - uses: softprops/action-gh-release@v2
        with:
          repository: mezaaceroestiben-tech/Mili-music
          token: ${{ secrets.EMM_PUBLICAR }}
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.titulo }}
          body_path: notas.md
          files: artefactos/**/*.apk
